:root{--br:16px;--br2:8px;--pd:16px;--pd2:8px;--pd3:4px;--color-black:#000;--color-white:#e2e6e3;--color-blue:#007aff;--color-gray10:hsla(135,7%,89%,.1);--color-gray20:hsla(135,7%,89%,.2);--color-gray30:hsla(135,7%,89%,.3);--color-gray50:hsla(135,7%,89%,.5);--color-gray10-hover:hsla(135,7%,89%,.2);--surface:#1a1a1a;--ease:ease;--page-time:500ms;--nav-width:clamp(368px,calc(346.6666666667px + 2.77777778vw),400px)}
html.light{--color-black:#fff;--color-white:#000;--color-gray10:rgba(0,0,0,.04);--color-gray20:rgba(0,0,0,.2);--color-gray30:rgba(0,0,0,.3);--color-gray50:rgba(0,0,0,.5);--color-gray10-hover:rgba(0,0,0,.08);--surface:#f5f5f5;color-scheme:light}
html.dark{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;overflow-y:scroll;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body,h1,h2,h3,h4,p,figure,ul{margin:0;padding:0}
body{min-width:320px;background:var(--color-black);color:var(--color-white);font-family:sf-pro-text,-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;font-weight:400;line-height:1.25;-webkit-font-smoothing:antialiased;transition:background-color .5s,color .5s}
a{color:inherit;text-decoration:none;display:inline-block}
button,input{font:inherit;color:inherit}
button{appearance:none;border:0;cursor:pointer;padding:0;background:none}
button:disabled{cursor:default}
h1,h2,h3,h4{font:inherit}
p,a,h2,h3{transition:color .5s}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-blue);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;top:8px;left:8px;z-index:1000;background:var(--color-white);color:var(--color-black);padding:12px;border-radius:24px;transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.wrapper{display:flex;align-items:flex-start;min-height:100svh}
.content{flex:1;min-width:0;outline:0}
.page__container{padding:8px}
.page__card{background:var(--color-gray10);border-radius:8px;padding:16px;transition:background-color .5s}
.page__button{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--color-gray10);border-radius:40px;min-height:40px;padding:0 16px;transition:background-color .5s;white-space:nowrap}
.page__button:hover{background:var(--color-gray10-hover)}
.page__button__close{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff1f;transition:background-color .5s,color .5s;flex-shrink:0}
.page__button__close svg{width:30px;height:30px;pointer-events:none}
html.light .page__button__close{background:#00000014}
.page__button__close:hover{background:#ffffff3d}
html.light .page__button__close:hover{background:#0000001f}
.nav{position:sticky;top:0;flex-shrink:0;max-height:100svh;overflow-y:auto;overflow-x:hidden;padding:8px 0 8px 8px;scrollbar-width:none;overscroll-behavior:contain}
.nav::-webkit-scrollbar{display:none}
.nav__inner{width:var(--nav-width)}
.nav__top__inner{display:flex;flex-flow:column;height:349px}
.nav__top__top{display:flex;align-items:center;justify-content:space-between;flex:1}
.nav__top__top__right{position:relative;display:flex}
.nav__light__mode{width:62px;height:38px;border-radius:38px;padding:3px;background:#ffffff1f;transition:background-color .5s,transform .5s;will-change:transform}
html.light .nav__light__mode{background:#00000014}
.nav__light__mode__knob{display:block;aspect-ratio:1;height:100%;border-radius:50%;background:var(--color-gray10);transition:background-color .5s,transform .5s}
html.dark .nav__light__mode__knob{transform:translateX(23px)}
html.light .nav__light__mode__knob{background:var(--color-black)}
.has-gallery .nav__light__mode{transform:translateX(-42px)}
.nav__top__top__gallery__mode{position:absolute;right:0;top:0;width:38px;height:38px;border-radius:50%;background:#ffffff1f;display:flex;align-items:center;justify-content:center;transition:background-color .5s,opacity .3s .25s}
html.light .nav__top__top__gallery__mode{background:#00000014}
.nav__top__top__right:not(.has-gallery) .nav__top__top__gallery__mode{opacity:0;pointer-events:none;transition:opacity .2s}
.nav__top__top__gallery__mode__play{border-style:solid;border-width:4.5px 0 4.5px 7.5px;border-color:transparent transparent transparent var(--color-white);transform:translateX(1px)}
.nav__light__mode:hover,.nav__top__top__gallery__mode:hover{background:#ffffff3d}
html.light .nav__light__mode:hover,html.light .nav__top__top__gallery__mode:hover{background:#0000001f}
.nav__top__middle{display:flex;flex-flow:column;align-items:center;justify-content:center;flex:auto;height:100%;row-gap:48px;min-height:160px}
.nav__top__middle__logo{margin:-10px;padding:10px;line-height:15px}
.nav__top__middle__logo h1{font-family:sf-pro-text,-apple-system,sans-serif;font-size:19.3px;font-weight:400;line-height:15px;letter-spacing:-.45px;white-space:nowrap;width:146px;text-align:center}
.nav__clock{font-family:sf-pro-display,-apple-system,sans-serif;font-size:23px;font-weight:400;letter-spacing:.45px;line-height:27px;text-align:center;cursor:default}
.nav__clock p{min-height:27px}
.nav__cards{display:flex;flex-flow:column;row-gap:8px}
.nav__card{pointer-events:none;position:relative}
.nav__card__inner{border-radius:10px;gap:12px;display:flex;height:98px;overflow:hidden;padding:16px;pointer-events:auto;position:relative;background:var(--surface);transition:background-color .5s;transform-origin:50% 100%;will-change:transform,opacity}
.nav__card__inner::after{content:'';position:absolute;inset:0;background:var(--color-gray10);opacity:0;transition:opacity .5s;pointer-events:none}
.nav__card__inner:hover::after{opacity:1}
.nav__cards .nav__card__inner{background:var(--color-black)}
.nav__cards .nav__card__inner:hover{background:var(--surface)}
.nav__cards .nav__card__inner::after,.nav__cards .nav__card__bg{display:none}
.nav__cards>.nav__card:has(+.nav__card)>.nav__card__inner::before{content:'';position:absolute;inset:auto 16px 0 93px;height:1px;background:rgba(255,255,255,.12);pointer-events:none}
html.light .nav__cards>.nav__card:has(+.nav__card)>.nav__card__inner::before{background:rgba(0,0,0,.08)}
.nav__cards .nav__card__inner[aria-current="page"]{background:hsl(var(--nav-tint-hue,220) 24% 20%)}
html.light .nav__cards .nav__card__inner[aria-current="page"]{background:hsl(var(--nav-tint-hue,220) 40% 90%)}
.nav__card__bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(76.17% 129.78% at 23.83% 65.4%,#4e4e4e 0%,#242424 100%);transition:background .5s}
html.light .nav__card__bg{background:radial-gradient(76.17% 129.78% at 23.83% 65.4%,#d9d6d5 0%,#efefef 100%)}
.nav__card__img{width:65px;height:65px;flex-shrink:0;background:var(--color-gray10);border-radius:10px;position:relative;overflow:hidden}
.nav__card__info{position:relative;z-index:1;min-width:0}
.nav__card__info h2{color:var(--color-white)}
.nav__card__info p{color:var(--color-gray50)}
.nav__card__about .nav__card__info{display:flex;flex-flow:column}
.nav__card__about__actions{display:none;gap:6px}
.nav__card__about__btn{background:var(--color-gray10);border-radius:10px;padding:0 12px;height:42px;flex:1;text-align:left;display:flex;align-items:center}
.nav__card__end{height:40px;flex-shrink:0}
.nav-card-mark{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--p0);color:var(--p1);font-family:sf-pro-display,sans-serif;font-size:32px;letter-spacing:-2px}
.nav-card-mark svg{width:39%;height:39%;overflow:visible}
.nav-card-mark[data-symbol="1"] svg{transform:rotate(45deg)}
.nav-card-mark[data-symbol="2"] svg{transform:rotate(90deg)}
.nav-card-mark[data-symbol="3"] svg{width:50%;height:50%;transform:rotate(-45deg)}
.case__study__list>.nav__card{display:none;padding-bottom:8px}
.case__study__slices{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.case__study__gallery__item{grid-column:1/-1;min-width:0}
.case__study__gallery__item__inner{position:relative;height:100%}
.case__study__media{position:relative;display:flex;padding:0;overflow:hidden;aspect-ratio:var(--aspect,1.5);cursor:pointer}
.case__study__media:hover{cursor:zoom-in}
.case__study__media__texts2{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:stretch}
.case__study__media__text__text2 h2{color:var(--color-gray50);margin-bottom:8px}
.case__study__media__text__text2 p{min-height:1.17em}
.case__study__media__text__text2 p+p{margin-top:1.17em}

function palette(project, offset = 0) {
  const p = project.palette;
  const c = offset % 4;
  return `--p0:${p[c]};--p1:${p[(c + 1) % 4]};--p2:${p[(c + 2) % 4]};--p3:${p[(c + 3) % 4]}`;
}

function art(project, kind = 'hero', index = 0, { animate = true } = {}) {
  const offset = ['poster', 'type', 'wordmark', 'swatches'].includes(kind) ? 0 : Math.floor(index / 5) % 4;
  let inside = '';
  const number = String(index + 1).padStart(2, '0');
  if (kind === 'hero') inside = `<div class="art__symbol">${mark}</div><div class="art__word"><span>PROJECT</span><span>${project.number}</span></div>`;
  else if (kind === 'wordmark') inside = `<div class="art__word">${project.number}<br>PROJECT</div>`;
  else if (kind === 'poster') inside = `<div class="art__word">A new<br>point<br>of view.</div>`;
  else if (kind === 'monogram') inside = mark;
  else if (kind === 'orbit') inside = '<div class="orbit"></div><div class="orbit"></div><div class="orbit"></div>';
  else if (kind === 'swatches') inside = ['01', '02', '03', '04'].map(n => `<div class="swatch">${n}</div>`).join('');
  else if (kind === 'tiles') inside = Array.from({ length: 6 }, () => `<div class="tile">${mark}</div>`).join('');
  else if (kind === 'type') inside = '<div class="art__alphabet">Aa Bb<br>123.</div><div class="art__rule"></div><div class="art__letters">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789?!&</div>';
  else if (kind === 'portrait') inside = '<div class="portrait-silhouette"></div>';
  else inside = `<div class="mock-window"><div class="mock-toolbar"><i class="mock-dot"></i><i class="mock-dot"></i><i class="mock-dot"></i><span>PROJECT ${project.number}</span></div><div class="mock-body"><div class="mock-sidebar">${'<i class="mock-line"></i>'.repeat(7)}</div><div class="mock-main"><div class="mock-heading">A place for<br>your next idea.</div><div class="mock-banner"></div><div class="mock-cards">${'<div class="mock-card"></div>'.repeat(3)}</div></div></div></div>`;
  const staticStyle = !animate || reduceMotion.matches ? 'animation:none;' : '';
  return `<div class="art art--${kind}${animate ? '' : ' is-static'}" style="${palette(project, offset)};${staticStyle}" role="img" aria-label="Графическая заглушка ${number}, ${esc(project.title)}">${inside}<span class="art__index" aria-hidden="true">PLACEHOLDER ${number}</span></div>`;
}

function updateCards() {
  state.navFrame = 0;
  if (document.body.classList.contains('is-all') || !nav.offsetWidth) return;
  const height = nav.clientHeight;
  const gap = innerWidth <= 768 ? 6 : 8;
  $$('.nav__cards>.nav__card').forEach(row => {
    const anchor = $('.nav__card__inner', row);
    if (!anchor || !anchor.offsetHeight) return;
    const cardHeight = anchor.offsetHeight;
    const top = row.offsetTop - nav.scrollTop;
    const start = height + cardHeight + gap * 2;
    const end = height - cardHeight * 1.5;
    const progress = Math.max(0, Math.min(1, (start - top) / (start - end)));
    anchor.style.transform = `translateY(${-2 * (cardHeight + gap) * (1 - progress)}px) scale(${.5 + progress * .5})`;
    anchor.style.opacity = Math.min(1, progress / .3);
    anchor.style.pointerEvents = progress > .04 ? '' : 'none';
    anchor.inert = progress <= .04;
    const background = $('.nav__card__bg', row);
    if (background) {
      const fade = Math.max(0, Math.min(1, (top - (height - cardHeight * 2.5)) / (cardHeight * .7)));
      background.style.opacity = Math.max(0, Math.min(1, (progress - .5) * 2)) * fade;
    }
  });
}

function renderGrid() {
  const grid = $('#project-grid');
  if (!grid) return;
  const count = innerWidth <= 656 ? 1 : innerWidth <= 1024 ? 3 : 4;
  const order = [...projects];
  [order[0], order[1]] = [order[1], order[0]];
  const query = state.search.trim().toLocaleLowerCase('ru');
  const filtered = order.filter(p => (state.filter === 'Все' || p.category === state.filter) && `${p.title} ${p.description} ${p.category} ${p.id}`.toLocaleLowerCase('ru').includes(query));
  const columns = Array.from({ length: count }, () => []);
  const heights = Array(count).fill(0);
  const width = (innerWidth - 16 - (count - 1) * 8) / count;
  for (const project of filtered) {
    const column = heights.indexOf(Math.min(...heights));
    columns[column].push(project);
    heights[column] += width / project.coverRatio + 77;
  }
  grid.innerHTML = columns.map(column => `<div class="case__studies__column">${column.map(p => `<a class="case__studies__card" href="${href(`/${p.id}`)}" data-route><div class="case__studies__card__media" style="--cover-ratio:${p.coverRatio}">${art(p, p.coverKind, 0, { animate: false })}</div><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p></a>`).join('')}</div>`).join('');

}

  input.addEventListener('keydown', e => { if (e.key === 'Escape') { menu.hidden = true; input.blur(); } });
  form.addEventListener('submit', e => { e.preventDefault(); menu.hidden = true; renderGrid(); });

];

function aboutPage() {
  return `<div class="page__container"><section class="page__card about__hero">${art(projects[1], 'portrait', 0, { animate: false })}</section><div class="about__content"><div class="about__content__left"><section class="page__card"><h2>Обо мне</h2><div class="about__lead"><p>Алексей Агаев — арт-директор в МТС Линк.</p><p>Здесь появится рассказ о моей работе, подходе и опыте. Пока это место для будущего текста: финальную самопрезентацию подготовим после отбора проектов.</p></div></section><section class="page__card"><h2>Направления</h2><div class="about__offerings__tabs" role="tablist" aria-label="Направления работы">${offerings.map((o, i) => `<button role="tab" id="offering-tab-${i}" aria-selected="${i === 0}" aria-controls="offering-panel" tabindex="${i === 0 ? 0 : -1}" class="about__offerings__tab${i === 0 ? ' selected' : ''}" data-offering="${i}">${o[0]}</button>`).join('')}</div><div class="about__offering" role="tabpanel" id="offering-panel" aria-labelledby="offering-tab-0"><p class="about__lead" id="offering-copy">${offerings[0][1]}</p><p class="about__offering__services" id="offering-services">${offerings[0][2]}</p></div></section><section class="page__card"><div class="about__experience__inner"><h2>Опыт и проекты</h2>${projects.map((_, i) => `<div class="about__experience__row"><span>Проект ${String(i + 1).padStart(2, '0')}</span><span>Место для роли и вклада</span><span>20XX</span></div>`).join('')}</div></section></div><div class="about__content__right"><section class="page__card about__contact"><h2>Контакты</h2><h3>Почта</h3><p>email@example.com</p><h3 style="margin-top:24px">Ссылки</h3><p>Появятся позже</p><div class="about__location"><div class="analog-clock" aria-hidden="true"><span class="analog-hand hour"></span><span class="analog-hand minute"></span></div><div>Москва<p style="color:var(--color-gray50)">Местное время</p></div></div></section><section class="page__card"><h2>Сейчас</h2><p style="margin-top:16px">Здесь появится короткое обновление о текущей работе.</p></section></div></div></div>`;
}

function bindAbout() {
  const select = index => {
    $$('[data-offering]').forEach((button, i) => {
      button.classList.toggle('selected', i === index);
      button.setAttribute('aria-selected', String(i === index));
      button.tabIndex = i === index ? 0 : -1;
    });
    const panel = $('#offering-panel');
    panel.setAttribute('aria-labelledby', `offering-tab-${index}`);
    $('#offering-copy').textContent = offerings[index][1];
    $('#offering-services').textContent = offerings[index][2];
    panel.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduceMotion.matches ? 1 : 500 });
  };
  $$('[data-offering]').forEach((button, index) => {
    button.addEventListener('click', () => select(index));
    button.addEventListener('keydown', e => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
      e.preventDefault();
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? 2 : (index + (e.key === 'ArrowRight' ? 1 : -1) + 3) % 3;
      select(next);
      $(`[data-offering="${next}"]`).focus();
    });
  });
}

function routeFor(path) {
  const normalized = path.replace(/\/$/, '') || '/';
  if (normalized === '/' || normalized === '/home' || normalized === '/index.html') return { type: 'home' };
  if (normalized === '/all') return { type: 'all' };
  if (normalized === '/about') return { type: 'about' };
  const project = projects.find(p => `/${p.id}` === normalized) || (normalized === '/tinder' ? projects[0] : null);
  return project ? { type: 'case', project } : { type: '404' };
}

async function fade(element, from, to, duration = 500) {
  if (!element) return;
  element.getAnimations().forEach(animation => animation.cancel());
  const animation = element.animate([{ opacity: from }, { opacity: to }], { duration: reduceMotion.matches ? 1 : duration, easing: 'ease', fill: 'forwards' });
  await animation.finished.catch(() => {});
  element.style.opacity = to;
  animation.cancel();
}

async function navigate(path, { push = true, instant = false } = {}) {
  const next = routeFor(path);
  const epoch = ++state.epoch;
  if (state.gallery !== null) await closeGallery({ instant: true, scroll: false });
  clearInterval(state.homeTimer);
  mediaObserver.disconnect();
  if (!instant) await fade(content, 1, 0);
  if (epoch !== state.epoch) return;
  if (push && `${location.pathname}${location.search}` !== href(path)) history.pushState({}, '', href(path));
  state.route = next.type;
  document.body.dataset.template = next.type;
  document.body.classList.toggle('is-all', next.type === 'all');
  document.body.classList.remove('feed-open');
  $('[data-updates]').textContent = 'Обновления';
  $('.nav__top__top__right').classList.toggle('has-gallery', next.type === 'case');
  if (next.type === 'case') {
    state.project = next.project;
    state.lastCase = `/${next.project.id}`;
    content.innerHTML = casePage(next.project);
    $$('.case__study__media').forEach(media => {
      $('.art', media).classList.add('is-paused');
      mediaObserver.observe(media);
    });
    document.title = `${next.project.title} · ${profile.name}`;
  } else if (next.type === 'all') {
    content.innerHTML = allPage();
    bindAll();
    document.title = `Все проекты · ${profile.name}`;
  } else if (next.type === 'about') {
    content.innerHTML = aboutPage();
    bindAbout();
    tick();
    document.title = `Обо мне · ${profile.name}`;
  } else if (next.type === 'home') {
    content.innerHTML = homePage();
    document.title = `${profile.name} · Портфолио`;
    let frame = 0;
    if (!reduceMotion.matches) state.homeTimer = setInterval(() => {
      if (document.hidden || state.route !== 'home' || (mobile.matches && !document.body.classList.contains('feed-open'))) return;
      frame = (frame + 1) % projects.length;
      const hero = $('#home-hero');
      if (hero) hero.innerHTML = art(projects[frame], ['monogram', 'poster', 'wordmark', 'tiles', 'type', 'orbit'][frame % 6], frame, { animate: false });
    }, 700);
  } else {
    content.innerHTML = `<div class="page__container"><div class="page__card not-found"><p>Такой страницы пока нет.</p><a class="page__button" href="${href('/all')}" data-route>Все проекты ${arrowIcon}</a></div></div>`;
    document.title = `Страница не найдена · ${profile.name}`;
  }
  $$('.nav__cards .nav__card__inner').forEach(anchor => {
    const selected = (next.type === 'case' && anchor.dataset.project === next.project.id)
      || (next.type === 'about' && anchor.getAttribute('href') === href('/about'));
    if (selected) {
      if (anchor.getAttribute('aria-current') !== 'page') anchor.style.setProperty('--nav-tint-hue', Math.floor(Math.random() * 360));
      anchor.setAttribute('aria-current', 'page');
    } else anchor.removeAttribute('aria-current');
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
  resize();
  if (!instant) content.focus({ preventScroll: true });
  content.style.opacity = instant ? 1 : 0;
  if (!instant) await fade(content, 0, 1);
  if (epoch !== state.epoch) return;
  $('#announcer').textContent = document.title;
}

function mediaBlocks() { return caseLayout.filter(block => block.media !== undefined); }

function sizeSlide() {
  const block = mediaBlocks()[state.gallery];
  const stage = $('.gallery-slide');
  if (!stage || !block) return;
  const ratio = block.ratio || 1.5;
  const maxHeight = innerHeight - 112;
  const width = Math.min(innerWidth - 16, maxHeight * ratio);
  stage.style.width = `${width}px`;
  stage.style.height = `${width / ratio}px`;
}

function renderDots() {
  const total = mediaBlocks().length;
  const start = Math.max(0, Math.min(state.gallery - 2, total - 5));
  const end = Math.min(total, start + 5);
  $('.case__study__gallery__pagination').innerHTML = Array.from({ length: end - start }, (_, i) => {
    const number = i + start;
    const distance = Math.abs(number - state.gallery);
    return `<button class="gallery-dot${number === state.gallery ? ' selected' : ''}" style="--dot-scale:${distance > 2 ? .4 : distance === 2 ? .65 : 1}" data-slide="${number}" type="button" aria-label="Медиа ${number + 1} из ${total}" ${number === state.gallery ? 'aria-current="true"' : ''}></button>`;
  }).join('');
  $('[data-gallery-prev]').disabled = state.gallery === 0;
  $('[data-gallery-next]').disabled = state.gallery === total - 1;
}

async function openGallery(index) {
  if (state.route !== 'case' || state.gallery !== null) return;
  state.gallery = index;
  state.galleryClosing = false;
  state.galleryFocus = document.activeElement;
  state.pageScroll = window.scrollY;
  const block = mediaBlocks()[index];
  galleryRoot.innerHTML = `<div class="case__study__gallery" role="dialog" aria-modal="true" aria-label="Галерея: ${esc(state.project.title)}"><div class="case__study__gallery__inner"><div class="case__study__gallery__top"><button class="page__button__close" data-gallery-close type="button" aria-label="Закрыть галерею">${closeIcon}</button></div><div class="case__study__gallery__wrapper"><div class="gallery-slide">${art(state.project, block.kind, block.media)}</div><div class="case__study__gallery__nav"><button class="case__study__gallery__nav__button prev" data-gallery-prev type="button" aria-label="Предыдущее медиа"></button><button class="case__study__gallery__nav__button next" data-gallery-next type="button" aria-label="Следующее медиа"></button></div></div><div class="case__study__gallery__pagination" aria-label="Выбор медиа"></div></div></div>`;
  document.body.style.overflow = 'hidden';
  document.body.classList.add('gallery-open');
  $('#app').inert = true;
  renderDots();
  sizeSlide();
  $('[data-gallery-close]').addEventListener('click', () => closeGallery());
  $('[data-gallery-prev]').addEventListener('click', () => changeSlide(state.gallery - 1));
  $('[data-gallery-next]').addEventListener('click', () => changeSlide(state.gallery + 1));
  $('.case__study__gallery__pagination').addEventListener('click', e => {
    const dot = e.target.closest('[data-slide]');
    if (dot) changeSlide(Number(dot.dataset.slide));
  });
  $$('[data-gallery-prev],[data-gallery-next]').forEach(button => {
    button.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch' || button.disabled) return;
      cursor.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
      cursor.classList.toggle('previous', button.hasAttribute('data-gallery-prev'));
      cursor.classList.add('visible');
    });
    button.addEventListener('pointerleave', () => cursor.classList.remove('visible'));
  });
  let startX = 0;
  let startY = 0;
  let mouseStart = null;
  let suppressClick = false;
  const gallery = $('.case__study__gallery');
  const suppressDragClick = () => {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 350);
  };
  gallery.addEventListener('click', e => {
    if (!suppressClick || e.detail === 0) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
  gallery.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button === 0 && !e.target.closest('.case__study__gallery__top,.case__study__gallery__pagination')) mouseStart = [e.clientX, e.clientY];
  });
  gallery.addEventListener('pointerup', e => {
    if (!mouseStart) return;
    const dx = e.clientX - mouseStart[0];
    const dy = e.clientY - mouseStart[1];
    mouseStart = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      suppressDragClick();
      changeSlide(state.gallery + (dx < 0 ? 1 : -1));
    }
  });
  gallery.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  gallery.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { suppressDragClick(); changeSlide(state.gallery + (dx < 0 ? 1 : -1)); }
    else if (dy > 120 && Math.abs(dy) > Math.abs(dx) * 1.4) closeGallery();
  }, { passive: true });
  $('[data-gallery-close]').focus({ preventScroll: true });
  await fade(gallery, 0, 1);
  if (state.gallery === null || state.galleryClosing) return;
  await fade($('.case__study__gallery__inner'), 0, 1);
}

function changeSlide(index) {
  const blocks = mediaBlocks();
  if (index < 0 || index >= blocks.length || index === state.gallery || state.galleryClosing) return;
  const previous = state.gallery;
  state.gallery = index;
  const stage = $('.gallery-slide');
  const old = $('.art', stage);
  old.classList.add('old-art');
  const block = blocks[index];
  stage.insertAdjacentHTML('afterbegin', art(state.project, block.kind, block.media));
  const widthBefore = stage.offsetWidth;
  const heightBefore = stage.offsetHeight;
  sizeSlide();
  const duration = reduceMotion.matches ? 1 : 300;
  if (matchMedia('(pointer:coarse)').matches) {
    const direction = index > previous ? 1 : -1;
    $('.art:not(.old-art)', stage).animate([{ transform: `translateX(${direction * 100}%)` }, { transform: 'translateX(0)' }], { duration, easing: 'ease' });
    const animation = old.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-direction * 100}%)` }], { duration, easing: 'ease' });
    animation.finished.then(() => old.remove()).catch(() => old.remove());
  } else {
    const animation = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration, fill: 'forwards' });
    animation.finished.then(() => old.remove()).catch(() => old.remove());
  }
  if (widthBefore !== stage.offsetWidth || heightBefore !== stage.offsetHeight) stage.animate([{ width: `${widthBefore}px`, height: `${heightBefore}px` }, { width: stage.style.width, height: stage.style.height }], { duration, easing: 'ease' });
  renderDots();
  cursor.classList.remove('visible');
  $('#announcer').textContent = `Медиа ${index + 1} из ${blocks.length}`;
}

async function closeGallery({ instant = false, scroll = true } = {}) {
  if (state.gallery === null || state.galleryClosing) return;
  state.galleryClosing = true;
  const index = state.gallery;
  const gallery = $('.case__study__gallery');
  cursor.classList.remove('visible');
  if (!instant) await fade($('.case__study__gallery__inner'), 1, 0);
  document.body.style.overflow = '';
  document.body.classList.remove('gallery-open');
  const block = $(`[data-media="${index}"]`);
  if (scroll && block) {
    const top = block.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({ top: Math.max(0, top - Math.max((innerHeight - block.offsetHeight) / 2, 8)), behavior: 'instant' });
  }
  if (!instant) await fade(gallery, 1, 0);
  galleryRoot.innerHTML = '';
  $('#app').inert = false;
  state.gallery = null;
  state.galleryClosing = false;
  if (state.galleryFocus?.isConnected) state.galleryFocus.focus({ preventScroll: true });
}

document.addEventListener('click', e => {
  const link = e.target.closest('a[data-route]');
  if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && e.button === 0) {
    e.preventDefault();
    const path = new URL(link.href).pathname.slice(basePath.length) || '/';
    navigate(path);
    return;
  }
  const media = e.target.closest('[data-open-gallery]');
  if (media) openGallery(Number(media.dataset.openGallery));
  if (state.route === 'all' && !e.target.closest('.case__studies__filters__top__inner')) {
    const menu = $('.case__studies__filters__categories');
    if (menu) menu.hidden = true;
  }
});

document.addEventListener('keydown', e => {
  if (state.gallery !== null) {
    if (e.key === 'Escape') { e.preventDefault(); closeGallery(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); changeSlide(state.gallery - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); changeSlide(state.gallery + 1); }
    if (e.key === 'Tab') {
      const focusable = $$('button:not(:disabled)', galleryRoot);
      const first = focusable[0];
      const last = focusable.at(-1);
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  const media = e.target.closest('[data-open-gallery]');
  if (media && ['Enter', ' '].includes(e.key)) { e.preventDefault(); openGallery(Number(media.dataset.openGallery)); }
});

$('.nav__top__top__gallery__mode').addEventListener('click', () => openGallery(0));
window.addEventListener('popstate', () => navigate(location.pathname.slice(basePath.length) || '/', { push: false }));
document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('background-tab', document.hidden));
createNav();
resize();
const initialPath = sessionStorage.getItem('portfolio-redirect');
if (initialPath) {
  sessionStorage.removeItem('portfolio-redirect');
  history.replaceState({}, '', initialPath);
}
await navigate(location.pathname.slice(basePath.length) || '/', { push: false, instant: true });

</script>
  </head>
  <body>
    <a class="skip-link" href="#content">Перейти к содержимому</a>
    <main class="wrapper" id="app">
      <aside class="nav is-responsive" aria-label="Навигация по портфолио">
        <div class="nav__inner">
          <header class="nav__top">
            <div class="nav__top__inner">
              <div class="nav__top__top">
                <a class="page__button" href="/all" data-route>Все проекты</a>
                <div class="nav__top__top__right has-gallery">
                  <button class="nav__light__mode" type="button" role="switch" aria-checked="false" aria-label="Светлая тема"><span class="nav__light__mode__knob"></span></button>
                  <button class="nav__top__top__gallery__mode" type="button" aria-label="Открыть галерею"><span class="nav__top__top__gallery__mode__play"></span></button>
                </div>
              </div>
              <div class="nav__top__middle">
                <a href="/" data-route class="nav__top__middle__logo" aria-label="Алексей Агаев — главная"><h1>ALEXEY AGAEV</h1></a>
                <div class="nav__clock" aria-label="Местное время"><p id="clock-date"></p><p id="clock-time"></p></div>
              </div>
            </div>
          </header>
          <nav class="nav__cards" aria-label="Проекты" id="project-navigation"></nav>
        </div>
      </aside>
      <div class="content" id="content" tabindex="-1"></div>
    </main>
    <div id="gallery-root"></div>
    <div class="page__cursor" aria-hidden="true"><span class="page__cursor__inner"></span></div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript><p style="padding:24px">Для просмотра анимаций и проектов включите JavaScript.</p></noscript>
  </body>
</html>
